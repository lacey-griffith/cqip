name: Deploy to Cloudflare Workers

# Every push to main that touches application code triggers a
# Cloudflare Workers deploy. Docs-only commits skip via paths-ignore.
# Manual runs available from the Actions tab via workflow_dispatch.
#
# TESTS GATE THE DEPLOY (Batch G7, 2026-08-23). Before this, the 22 test files
# in tests/ ran only when someone remembered, and CI was install -> build ->
# deploy -> smoke with no test step at all. A harness nobody runs is
# documentation. The `deploy` job now `needs: test`, so a red test stops the
# deploy rather than being discovered afterwards.
#
# This file is in `paths-ignore`, so editing it does NOT trigger a deploy on its
# own — the `test` job first runs on whatever push next touches app code.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN          — Workers Scripts:Edit scope
#   CLOUDFLARE_ACCOUNT_ID         — also visible in `npx wrangler whoami`
#   NEXT_PUBLIC_SUPABASE_URL      — inlined into Next bundle + CSP at build
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — inlined into Next bundle at build
#   SUPABASE_SERVICE_ROLE_KEY     — required at build (admin route modules
#                                   import supabaseAdmin at module-eval
#                                   time during page-data collection) AND
#                                   at runtime on the Worker
#                                   (`wrangler secret put`)
#
# Runtime-only Worker secrets (NOT needed in this workflow):
#   JIRA_API_TOKEN, CQIP_SYNC_AUTH_KEY, CQIP_BRANDS_API_TOKEN,
#   CQIP_DROUGHT_AUTH_KEY — set via `wrangler secret put`.

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pure-function tests over lib/ — node:test + node:assert, no DOM, no
      # browser. They need no secrets and no built app, which is why this job
      # runs standalone ahead of the build rather than inside it.
      - name: Run tests
        run: npm test

  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Post-deploy smoke check
        run: |
          sleep 30
          body=$(mktemp)
          status=$(curl -fsS -o "$body" -w "%{http_code}" https://cqip.l-hay.workers.dev/api/health)
          echo "GET /api/health → $status"
          cat "$body"; echo
          if [ "$status" != "200" ]; then
            echo "Smoke check failed: expected 200, got $status"
            exit 1
          fi
          if ! grep -q '"status":"ok"' "$body"; then
            echo "Smoke check failed: body did not contain {\"status\":\"ok\"}"
            exit 1
          fi
